<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>News CMS · Review</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body data-page="review">
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="/index.html">News CMS</a>
        <nav class="site-nav" aria-label="Main navigation"></nav>
      </div>
    </header>
    <main class="page">
      <h1>Review queue</h1>
      <section id="review-posts" class="grid" aria-live="polite">
        <p class="muted">Loading…</p>
      </section>
      <h2>Approved · ready to publish</h2>
      <section id="approved-posts" class="grid" aria-live="polite">
        <p class="muted">Loading…</p>
      </section>
    </main>
    <script src="/app.js" defer></script>
  </body>
</html>
