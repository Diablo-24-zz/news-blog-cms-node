<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>News CMS · Blog</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body data-page="public-list">
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="/index.html">News CMS</a>
        <nav class="site-nav" aria-label="Main navigation"></nav>
      </div>
    </header>
    <main class="page">
      <section class="hero">
        <h1>Latest stories</h1>
        <p class="muted">Plain-language news, published by the newsroom.</p>
      </section>
      <form id="search-form" class="card actions">
        <label for="search">Search title</label
        ><input id="search" name="search" type="search" /><button type="submit">
          Search
        </button>
      </form>
      <section id="public-posts" class="grid" aria-live="polite"></section>
      <div class="pagination"></div>
    </main>
    <script src="/app.js" defer></script>
  </body>
</html>
