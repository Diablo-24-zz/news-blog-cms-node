<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>News CMS · Change password</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body data-page="change-password">
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="/index.html">News CMS</a>
        <nav class="site-nav" aria-label="Main navigation"></nav>
      </div>
    </header>
    <main class="page narrow">
      <form id="change-password-form" class="card stack">
        <h1>Change your password</h1>
        <p class="muted">
          Your temporary password must be replaced before you can use the CMS.
        </p>
        <label
          >Current password<input
            name="currentPassword"
            type="password"
            minlength="8"
            required /></label
        ><label
          >New password<input
            name="newPassword"
            type="password"
            minlength="8"
            required /></label
        ><button type="submit">Change password</button>
      </form>
    </main>
    <script src="/app.js" defer></script>
  </body>
</html>
